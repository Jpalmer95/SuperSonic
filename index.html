<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest 3 World Explorer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: white;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #222; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid #333;
            max-width: 340px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.3s;
        }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 0, 0, 0.9);
            z-index: 200;
            display: none; /* Flex when active */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            color: #4caf50;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            color: #aaa;
            font-weight: bold;
            text-transform: uppercase;
        }

        input[type="text"] {
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        
        input[type="file"] {
            display: none;
        }

        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
        }

        button:hover {
            background: #4caf50;
            border-color: #4caf50;
            color: black;
        }

        button.secondary {
            background: #2d2d2d;
            border-color: #444;
        }
        
        button.local-file {
            background: #224444;
            border-color: #44aaaa;
        }

        /* Library Styles */
        .library-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 180px;
            overflow-y: auto;
            background: #151515;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .library-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .library-item:hover {
            background: #333;
            border-color: #555;
        }

        .library-item button.add-btn {
            padding: 2px 8px;
            font-size: 16px;
            line-height: 1;
            background: transparent;
            border: none;
            color: #4caf50;
        }

        /* Queue Styles */
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
            background: #151515;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .queue-list li {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            font-size: 12px;
            border-bottom: 1px solid #222;
            background: #1a1a1a;
        }

        .queue-list li.playing {
            background: #112211;
            color: #4caf50;
            border-left: 3px solid #4caf50;
        }

        .queue-actions {
            margin-left: auto;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            padding: 2px 6px;
            font-size: 10px;
            background: #333;
            border: 1px solid #444;
            color: #ccc;
            border-radius: 3px;
        }
        .icon-btn:hover { background: #555; }
        .btn-del:hover { background: #aa2222; border-color: #ff0000; color: white; }

        .player-controls {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .track-name {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
            cursor: pointer;
        }

        #current-track-name {
            font-size: 11px;
            color: #2196f3;
            height: 15px;
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
        }
        
        #loading { display: none; color: #2196f3; font-size: 12px; }

        .instructions {
            font-size: 11px;
            color: #888;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        
        /* Game Over Styles */
        .go-title { font-size: 40px; color: red; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 20px red; }
        .go-score { font-size: 24px; margin-bottom: 40px; }
        .go-btn { font-size: 20px; padding: 15px 30px; background: white; color: black; border: none; cursor: pointer; }
        .go-btn:hover { background: #ccc; }
    </style>
    <!-- Three.js and Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-container">
        <h1>World Explorer</h1>
        
        <!-- Location Controls -->
        <div class="control-group">
            <label>Locations</label>
            <div style="display:flex; gap:5px;">
                <button onclick="loadAustin()" style="flex:1; border-left: 3px solid #2196f3;">Austin, TX</button>

        <!-- Music Library -->
        <div class="control-group">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label>GitHub Library (jpalmer95)</label>
                <button onclick="radio.fetchLibrary()" style="padding:2px 6px; font-size:10px;">↻ Refresh</button>

        <!-- Queue & Player -->

            <ul id="queue-list" class="queue-list">

        <div class="instructions">
            <strong>Controls:</strong><br>
            • <strong>Fly:</strong> Hold Triggers<br>

            • <strong>Boost:</strong> Hold Grip<br>
            • <strong>Menu:</strong> Left 'X' Button<br>
        </div>
    </div>
    
    <div id="game-over-screen">
        <div class="go-title">SYSTEM FAILURE</div>
        <div class="go-score" id="final-score">Score: 0</div>
        <button class="go-btn" onclick="restartGame()">REBOOT SYSTEM</button>
        <p style="margin-top:20px; color:#888;">(Or press Trigger in VR)</p>
    </div>

    <div id="vr-status">Ready for VR</div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // --- Global Variables ---
        let camera, scene, renderer;
        let dolly; 
        let controllers = [];
        let raycaster; 
        let laserPointer; // Visual laser
        
        // Audio
        let listener, coinSound, laserSound, boomSound, crashSound;
        window.radio = null; 
        window.vrMenu = null;

        // Environment & Objects
        let cityGroup = new THREE.Group();
        let coinsGroup = new THREE.Group();
        let propsGroup = new THREE.Group(); 
        let enemiesGroup = new THREE.Group();
        let projectiles = []; 

        let pmremGenerator; // For HDRI
        
        // HUD
        let hudTexture, hudMesh;
        let buildingTexture; // Shared texture

        // Game State
        let coins = 0;
        let kills = 0;
        const playerState = {
            flying: true, 
            velocity: new THREE.Vector3(),
            baseSpeed: 15,
            speedMultiplier: 1.0,
            turbo: false,
            height: 1.6,
            menuOpen: false,
            isPlanet: false,
            planetRadius: 2000,
            health: 5,
            maxHealth: 5,
            invulnerableUntil: 0,
            isGameOver: false
        };

        const buttonStates = { leftStickClick: false, menuButton: false, trigger: false, lastMenuToggle: 0, b: false, y: false };
        const clock = new THREE.Clock();
        const keyState = {}; 

        // --- Helper: Texture Gen ---
        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Background (Concrete)
            ctx.fillStyle = '#888899';
            ctx.fillRect(0,0,256,256);
            
            // Noise
            for(let i=0; i<5000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#9999aa' : '#777788';
                ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
            }

            // Windows
            const rows = 8; const cols = 4;
            const w = 256/cols; const h = 256/rows;
            
            for(let i=0; i<cols; i++) {
                for(let j=0; j<rows; j++) {
                    const isLit = Math.random() > 0.6;
                    ctx.fillStyle = isLit ? '#1a2a3a' : '#111'; // Dark blue glass or black
                    ctx.fillRect(i*w + 8, j*h + 4, w - 16, h - 8);
                    
                    // Reflection streak
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath();
                    ctx.moveTo(i*w+8, j*h+4);
                    ctx.lineTo(i*w+w-8, j*h+h-4);
                    ctx.stroke();
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- VR Menu System ---
        class VRMenuSystem {
            constructor(scene, radio) {
                this.scene = scene;
                this.radio = radio;
                
                this.canvas = document.createElement('canvas');
                this.canvas.width = 512;
                this.canvas.height = 512;
                this.ctx = this.canvas.getContext('2d');
                this.texture = new THREE.CanvasTexture(this.canvas);
                
                const geometry = new THREE.PlaneGeometry(0.8, 0.8);
                const material = new THREE.MeshBasicMaterial({ map: this.texture, transparent: true, opacity: 0.95, depthTest: false });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.renderOrder = 1000;
                this.mesh.visible = false;
                this.mesh.name = "VR_MENU";
                scene.add(this.mesh);
                
                const cursorGeo = new THREE.SphereGeometry(0.02, 16, 16);
                const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffff00, depthTest: false });
                this.cursor = new THREE.Mesh(cursorGeo, cursorMat);
                this.cursor.visible = false;
                this.cursor.renderOrder = 1001;
                scene.add(this.cursor);

                this.options = [
                    { label: "Location", type: "select", values: ["Metro", "Neon", "Mars", "Austin"], current: 0, y: 120 },
                    { label: "TRAVEL TO SELECTED", type: "action", action: "warp", y: 170 },
                    { label: "Speed Gear", type: "slider", min: 1, max: 10, current: 1, y: 230 },
                    { label: "Toggle Music", type: "action", action: "toggle", y: 290 },
                    { label: "Next Track", type: "action", action: "next", y: 350 },
                    { label: "Close Menu", type: "action", action: "close", y: 410 }
                ];
                this.hoverIndex = -1;
                this.cursorX = 0; this.cursorY = 0;
                this.redraw();
            }

            toggle() {
                if (playerState.isGameOver) return; // Locked if dead
                this.mesh.visible = !this.mesh.visible;
                this.cursor.visible = false;
                playerState.menuOpen = this.mesh.visible;
                
                if (laserPointer) laserPointer.visible = this.mesh.visible;

                if(this.mesh.visible) {
                    playerState.velocity.set(0,0,0);
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize().multiplyScalar(1.5);
                    const spawnPos = new THREE.Vector3().copy(camera.position).add(dolly.position).add(forward);
                    spawnPos.y = camera.position.y + dolly.position.y; 
                    this.mesh.position.copy(spawnPos);
                    this.mesh.lookAt(camera.position.clone().add(dolly.position));
                    this.options[1].current = playerState.speedMultiplier;
                    this.mesh.updateMatrixWorld(true); 
                    this.redraw();
                }
            }

            checkIntersection(controller) {
                if (!this.mesh.visible) return false;
                const origin = new THREE.Vector3();
                const direction = new THREE.Vector3();
                controller.getWorldPosition(origin);
                const rot = new THREE.Matrix4().extractRotation(controller.matrixWorld);
                direction.set(0, 0, -1).applyMatrix4(rot).normalize();
                raycaster.set(origin, direction);
                const intersects = raycaster.intersectObject(this.mesh);

                if (intersects.length > 0) {
                    this.cursor.visible = true;
                    this.cursor.position.copy(intersects[0].point);
                    const uv = intersects[0].uv;
                    const canvasY = (1 - uv.y) * 512;
                    let newHover = -1;
                    this.options.forEach((opt, i) => { if (Math.abs(canvasY - opt.y) < 25) newHover = i; });
                    if (this.hoverIndex !== newHover) { this.hoverIndex = newHover; this.redraw(); }
                    return true; 
                } else {
                    this.cursor.visible = false;
                    if (this.hoverIndex !== -1) { this.hoverIndex = -1; this.redraw(); }
                    return false;
                }
            }

            click() {
                if (this.hoverIndex === -1) return;
                const opt = this.options[this.hoverIndex];
                if (opt.label === "Location") {
                    opt.current = (opt.current + 1) % opt.values.length;
                } 
                else if (opt.label === "TRAVEL TO SELECTED") {
                    const locOpt = this.options[0];
                    const loc = locOpt.values[locOpt.current];
                    if (loc === "Austin") window.loadAustin(); else window.switchLocation(loc.toLowerCase());
                    this.toggle();
                }
                else if (opt.label === "Speed Gear") {
                    opt.current++; if(opt.current > opt.max) opt.current = opt.min;
                    playerState.speedMultiplier = opt.current;
                }
                else if (opt.label === "Toggle Music") this.radio.toggle();
                else if (opt.label === "Next Track") this.radio.playNext();
                else if (opt.label === "Close Menu") this.toggle();
                this.redraw();
            }

            redraw() {
                const ctx = this.ctx; const w = this.canvas.width; const h = this.canvas.height;
                ctx.fillStyle = "rgba(20, 20, 30, 0.95)"; ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = "#4caf50"; ctx.lineWidth = 8; ctx.strokeRect(4, 4, w-8, h-8);
                ctx.fillStyle = "#4caf50"; ctx.font = "bold 40px Arial"; ctx.textAlign = "center"; ctx.fillText("SYSTEM MENU", w/2, 60);
                ctx.font = "30px Arial";
                this.options.forEach((opt, i) => {
                    if (i === this.hoverIndex) { ctx.fillStyle = "#226622"; ctx.fillRect(40, opt.y - 35, w - 80, 50); ctx.fillStyle = "#fff"; } else { ctx.fillStyle = "#aaa"; }
                    let text = opt.label;
                    if (opt.type === "select") text += `: < ${opt.values[opt.current]} >`;
                    if (opt.type === "slider") text += `: [ ${opt.current} ]`;
                    ctx.textAlign = "center"; ctx.fillText(text, w/2, opt.y);
                });
                if (playerState.menuOpen) {
                    ctx.fillStyle = this.hoverIndex !== -1 ? "#00ff00" : "#ff0000";
                    ctx.beginPath(); ctx.arc(this.cursorX, this.cursorY, 8, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle = "#666"; ctx.font = "20px Arial"; ctx.fillText("Pointer & Trigger to Select", w/2, h - 30);
                this.texture.needsUpdate = true;
            }
        }

        // --- Queue-Based Radio System ---
        class RadioSystem {
            constructor(listener) {
                this.listener = listener;
                this.audioElement = new Audio();
                this.audioElement.loop = false; this.audioElement.crossOrigin = "anonymous"; this.audioElement.src = "";
                this.sound = new THREE.Audio(listener);
                this.sound.setMediaElementSource(this.audioElement);
                this.sound.setVolume(0.5);
                this.queue = []; this.currentIndex = -1; this.isPlaying = false;
                this.githubOwner = "jpalmer95"; this.githubRepo = "openmusic";

                this.audioElement.addEventListener('ended', () => this.playNext());
                this.audioElement.addEventListener('error', () => {
                    if (this.audioElement.src && this.audioElement.src !== window.location.href) {
                        this.updateStatus("Error - Skipping");
                        if (this.queue.length > 0) setTimeout(() => this.playNext(), 1000); 
                    }
                });
                this.audioElement.addEventListener('playing', () => { this.isPlaying = true; this.updatePlayButton(); });
                this.audioElement.addEventListener('pause', () => { this.isPlaying = false; this.updatePlayButton(); });
                this.fetchLibrary();
            }
            async fetchLibrary() {
                const container = document.getElementById('library-container');
                container.innerHTML = '<div style="color:#888;">Fetching GitHub...</div>';
                try {
                    const response = await fetch(`https://api.github.com/repos/${this.githubOwner}/${this.githubRepo}/contents/`);
                    if (!response.ok) throw new Error("Repo not found");
                    const files = await response.json();
                    const audioFiles = files.filter(f => f.name.endsWith('.mp3'));
                    container.innerHTML = '';
                    if (audioFiles.length === 0) { container.innerHTML = 'No MP3s found.'; return; }
                    audioFiles.forEach(file => {
                        const rawUrl = file.download_url;
                        const div = document.createElement('div'); div.className = 'library-item';
                        div.innerHTML = `<span style="overflow:hidden;">${file.name}</span><button class="add-btn">+</button>`;
                        div.onclick = () => this.addToQueue({ name: file.name, url: rawUrl });
                        container.appendChild(div);
                    });
                } catch (e) { container.innerHTML = 'Error loading library.'; }
            }
            addToQueue(track) { this.queue.push(track); this.renderQueue(); if (this.currentIndex === -1) { this.currentIndex = 0; this.loadTrack(0, false); } }
            addLocalFiles(input) {
                if (!input.files || input.files.length === 0) return;
                Array.from(input.files).forEach(file => { this.queue.push({ name: file.name, url: URL.createObjectURL(file), isBlob: true }); });
                this.renderQueue();
                if (this.currentIndex === -1) { this.currentIndex = 0; this.loadTrack(0, false); }
                input.value = '';
            }
            removeFromQueue(index) {
                if (index === this.currentIndex) {
                    this.audioElement.pause(); this.isPlaying = false; this.queue.splice(index, 1);
                    if (this.queue.length === 0) { this.currentIndex = -1; this.updateStatus("Queue Empty"); } 
                    else { if (this.currentIndex >= this.queue.length) this.currentIndex = 0; this.loadTrack(this.currentIndex, false); }
                } else { this.queue.splice(index, 1); if (index < this.currentIndex) this.currentIndex--; }
                this.renderQueue(); this.updatePlayButton();
            }
            loadTrack(index, autoPlay = true) {
                if (index < 0 || index >= this.queue.length) return;
                this.currentIndex = index; const track = this.queue[index];
                this.audioElement.src = track.url; this.updateStatus(track.name); this.renderQueue(); 
                if (autoPlay) { if (this.listener.context.state === 'suspended') this.listener.context.resume(); this.audioElement.play().catch(e => { console.warn(e); this.updateStatus("Ready"); }); }
            }
            playNext() { if (this.queue.length === 0) return; let next = this.currentIndex + 1; if (next >= this.queue.length) next = 0; this.playTrack(next); }
            playPrev() { if (this.queue.length === 0) return; let prev = this.currentIndex - 1; if (prev < 0) prev = this.queue.length - 1; this.playTrack(prev); }
            playTrack(i) { this.loadTrack(i, true); }
            toggle() { if (this.queue.length === 0) return; if (this.currentIndex === -1) { this.playTrack(0); return; } if (this.isPlaying) this.audioElement.pause(); else this.audioElement.play(); }
            renderQueue() {
                const list = document.getElementById('queue-list'); list.innerHTML = '';
                if (this.queue.length === 0) { list.innerHTML = '<li style="color:#666;">Queue is empty</li>'; return; }
                this.queue.forEach((track, i) => {
                    const li = document.createElement('li'); if (i === this.currentIndex) li.classList.add('playing');
                    li.innerHTML = `<span class="track-name">${i+1}. ${track.name}</span><div class="queue-actions"><button class="icon-btn btn-del" onclick="event.stopPropagation(); radio.removeFromQueue(${i})">✖</button></div>`;
                    li.onclick = (e) => { if(e.target.tagName !== 'BUTTON') this.playTrack(i); };
                    list.appendChild(li);
                });
            }
            updateStatus(text) { const el = document.getElementById('current-track-name'); if(el) el.textContent = text; }
            updatePlayButton() { const btn = document.getElementById('btn-playpause'); if(btn) btn.innerText = this.isPlaying ? "Pause" : "Play"; }
        }

        // --- Helper Functions ---

        function getControllerByHandedness(hand) { return controllers.find(c => c.userData && c.userData.handedness === hand); }

        function generateCoinSound() {
            const audioCtx = listener.context;
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) { const t = i / audioCtx.sampleRate; data[i] = Math.sin(2 * Math.PI * (800 + 400 * t / 0.1) * t) * (1 - t/0.1); }
            coinSound.setBuffer(buffer); coinSound.setVolume(0.5);
        }

        function generateSFX() {
            const ctx = listener.context;
            // Coin
            const coinBuf = ctx.createBuffer(1, 4410, 44100);
            const cd = coinBuf.getChannelData(0);
            for (let i=0; i<4410; i++) cd[i] = Math.sin(i*0.3) * Math.exp(-i*0.003);
            coinSound.setBuffer(coinBuf); coinSound.setVolume(0.4);
            // Laser
            const laserBuf = ctx.createBuffer(1, 10000, 44100);
            const ld = laserBuf.getChannelData(0);
            for (let i=0; i<10000; i++) ld[i] = Math.sin(i*(0.2 - i*0.00001)) * Math.exp(-i*0.001);
            laserSound.setBuffer(laserBuf); laserSound.setVolume(0.3);
            // Boom
            const boomBuf = ctx.createBuffer(1, 20000, 44100);
            const bd = boomBuf.getChannelData(0);
            for (let i=0; i<20000; i++) bd[i] = (Math.random()*2-1) * Math.exp(-i*0.0005);
            boomSound.setBuffer(boomBuf); boomSound.setVolume(0.5);
            // Crash (Low Thud)
            const crashBuf = ctx.createBuffer(1, 30000, 44100);
            const crd = crashBuf.getChannelData(0);
            for (let i=0; i<30000; i++) crd[i] = (Math.random()*2-1) * Math.exp(-i*0.0002) * 0.5;
            crashSound = new THREE.Audio(listener);
            crashSound.setBuffer(crashBuf); crashSound.setVolume(0.6);
        }

        function spawnProjectile(controller) {
            if (!controller || playerState.isGameOver) return;
            if (laserSound.isPlaying) laserSound.stop(); laserSound.play();
            
            const geo = new THREE.CylinderGeometry(0.02, 0.02, 1, 8);
            geo.rotateX(-Math.PI / 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const bullet = new THREE.Mesh(geo, mat);
            
            const pos = new THREE.Vector3();
            const dir = new THREE.Vector3();
            controller.getWorldPosition(pos);
            const rot = new THREE.Matrix4().extractRotation(controller.matrixWorld);
            dir.set(0, 0, -1).applyMatrix4(rot).normalize();

            bullet.position.copy(pos);
            bullet.lookAt(pos.clone().add(dir));
            bullet.userData = { velocity: dir.multiplyScalar(150), life: 2.0 };
            
            scene.add(bullet);
            projectiles.push(bullet);
        }

        function spawnEnemies(count, radius, isPlanet) {
            while(enemiesGroup.children.length > 0) enemiesGroup.remove(enemiesGroup.children[0]);
            const geo = new THREE.OctahedronGeometry(2, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.5, roughness: 0.2 });
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                if (isPlanet) {
                    const vec = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).normalize().multiplyScalar(radius + 30 + Math.random()*100);
                    mesh.position.copy(vec);
                } else {
                    mesh.position.set((Math.random()-0.5)*800, 20 + Math.random()*60, (Math.random()-0.5)*800);
                }
                enemiesGroup.add(mesh);
            }
        }

        // ... City Gen
        function generateCity(type) {
            while(cityGroup.children.length > 0) cityGroup.remove(cityGroup.children[0]);
            while(coinsGroup.children.length > 0) coinsGroup.remove(coinsGroup.children[0]);
            while(propsGroup.children.length > 0) propsGroup.remove(propsGroup.children[0]);
            if(starSystem) scene.remove(starSystem);
            
            let buildingColors; let density = 150; let isNight = false;
            let hdri = '';
            playerState.isPlanet = false;
            
            const rgbeLoader = new RGBELoader();
            const loadEnv = (url) => {
                rgbeLoader.load(url, (texture) => {
                    const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                    scene.background = texture;
                    scene.environment = envMap;
                    texture.dispose();
                });
            };
            
            if (type === 'metro') { 
                loadEnv('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloofendal_48d_partly_cloudy_puresky_1k.hdr');
                scene.fog.color.setHex(0xaaaaaa); scene.fog.far = 500;
                isNight = false;
            }
            else if (type === 'neon') { 
                loadEnv('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/shanghai_bund_1k.hdr');
                scene.fog.color.setHex(0x050510); scene.fog.far = 300; 
                isNight = true; 
            }
            else if (type === 'mars') { 
                loadEnv('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloppenheim_02_puresky_1k.hdr');
                scene.background = new THREE.Color(0x551100);
                scene.fog.color.setHex(0x8B4513); scene.fog.far = 2000; 
                isNight = true; createStars(); playerState.isPlanet = true;
            }
            
            let floor;
            if(type === 'mars') {
                const floorGeo = new THREE.SphereGeometry(playerState.planetRadius, 128, 128);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.9 });
                floor = new THREE.Mesh(floorGeo, floorMat);
            } else {
                const floorGeo = new THREE.PlaneGeometry(2000, 2000); 
                const floorMat = new THREE.MeshStandardMaterial({ map: createGroundTexture(type), roughness: 0.8 });
                floor = new THREE.Mesh(floorGeo, floorMat); floor.rotation.x = -Math.PI / 2; 
            }
            cityGroup.add(floor);

            if (!playerState.isPlanet) {
                const boxGeo = new THREE.BoxGeometry(1, 1, 1);
                
                // Texture for Metro, Color for Neon
                let texMat;
                if (type === 'neon') {
                    // Solid Colors for Neon as requested
                    texMat = null;
                } else {
                    buildingTexture = createBuildingTexture();
                    texMat = new THREE.MeshStandardMaterial({ map: buildingTexture, roughness: 0.2, metalness: 0.5 });
                }

                for(let i=0; i<density; i++) {
                    const h = Math.random() * 40 + 5; const w = Math.random() * 10 + 5;
                    let mat = texMat;
                    if(type === 'neon') {
                        // Random vivid colors for Neon
                        const hue = Math.random();
                        const color = new THREE.Color().setHSL(hue, 1, 0.5);
                        mat = new THREE.MeshStandardMaterial({ 
                            color: color, 
                            roughness: 0.1,
                            emissive: color,
                            emissiveIntensity: 0.5
                        });
                    }
                    
                    const mesh = new THREE.Mesh(boxGeo, mat ? mat : texMat);
                    mesh.position.set((Math.random()-0.5)*600, h/2, (Math.random()-0.5)*600);
                    mesh.scale.set(w, h, w); mesh.castShadow = true; mesh.receiveShadow = true;
                    if (Math.abs(mesh.position.x) < 20 && Math.abs(mesh.position.z) < 20) continue;
                    cityGroup.add(mesh);
                }
                spawnProps(type); 
                spawnCoins();
            } else {
                // Mars bases
                const boxGeo = new THREE.BoxGeometry(1,1,1);
                for(let i=0; i<200; i++) {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                    const mesh = new THREE.Mesh(boxGeo, mat);
                    const vec = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).normalize().multiplyScalar(playerState.planetRadius);
                    mesh.position.copy(vec); mesh.lookAt(0,0,0); mesh.scale.set(10, 10, 40 + Math.random()*20);
                    cityGroup.add(mesh);
                }
            }
            
            spawnEnemies(50, playerState.planetRadius, playerState.isPlanet);
        }
        
        // --- GAME OVER LOGIC ---
        function triggerGameOver() {
            playerState.isGameOver = true;
            playerState.velocity.set(0,0,0);
            
            // Show HTML Overlay
            document.getElementById('final-score').innerText = `Coins: ${coins} | Kills: ${kills}`;
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('ui-container').style.opacity = '0';
        }

        window.restartGame = function() {
            playerState.isGameOver = false;
            playerState.health = playerState.maxHealth;
            coins = 0; kills = 0;
            playerState.velocity.set(0,0,0);
            
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('ui-container').style.opacity = '1';
            
            // Reset player to start
            if (playerState.isPlanet) {
                 dolly.position.set(0, playerState.planetRadius + 10, 0);
            } else {
                 dolly.position.set(0,0,0);
            }
            updateHUD();
        }

        // ... (Remaining functions)
        function handleDesktopInput(dt) {
            if (renderer.xr.isPresenting || playerState.isGameOver) return; 
            const speed = (keyState['ShiftLeft'] ? playerState.baseSpeed * 2 : playerState.baseSpeed) * playerState.speedMultiplier;
            const front = new THREE.Vector3(); camera.getWorldDirection(front);
            const right = new THREE.Vector3(); right.crossVectors(front, new THREE.Vector3(0, 1, 0)).normalize();
            if (keyState['KeyW']) playerState.velocity.addScaledVector(front, speed * dt);
            if (keyState['KeyS']) playerState.velocity.addScaledVector(front, -speed * dt);
            if (keyState['KeyD']) playerState.velocity.addScaledVector(right, speed * dt);
            if (keyState['KeyA']) playerState.velocity.addScaledVector(right, -speed * dt);
            if (keyState['Space']) playerState.velocity.y += 20 * dt;
            if (keyState['KeyC'] || keyState['ControlLeft']) playerState.velocity.y -= 20 * dt;
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        function render() { 
            const dt = Math.min(clock.getDelta(), 0.1); 
            updateGameObjects(dt, clock.getElapsedTime()); 
            updatePhysics(dt); 
            
            controllers.forEach(c => {
                const line = c.getObjectByName('line');
                if(line) line.visible = !playerState.menuOpen;
            });

            renderer.render(scene, camera); 
        }
        function animate() { renderer.setAnimationLoop(render); }
        
        // Update Physics for Collision
        function updatePhysics(dt) {
            if (playerState.menuOpen || playerState.isGameOver) { 
                playerState.velocity.set(0,0,0); 
                if(playerState.menuOpen) handleMenuInput(); 
                // Check trigger restart on game over
                if(playerState.isGameOver) {
                    const session = renderer.xr.getSession();
                    if(session) {
                         for (const source of session.inputSources) {
                             if(source.gamepad && source.gamepad.buttons[0].pressed) window.restartGame();
                         }
                    }
                }
                return; 
            }

            const damp = 2.0; const clampLength = 1000; 
            if (playerState.isPlanet) {
                // ... Planet Physics (Same as before)
                const planetCenter = new THREE.Vector3(0,0,0);
                const dist = dolly.position.distanceTo(planetCenter);
                if (dist < 1) { dolly.position.set(0, playerState.planetRadius + 10, 0); return; }
                const up = dolly.position.clone().normalize();
                const gravity = up.clone().negate().multiplyScalar(9.8 * dt);
                playerState.velocity.add(gravity);
                playerState.velocity.multiplyScalar(1 - (2.0 * dt)); 
                const surfaceHeight = playerState.planetRadius + playerState.height;
                if (dist < surfaceHeight) {
                    dolly.position.copy(up.multiplyScalar(surfaceHeight));
                    const vDotNormal = playerState.velocity.dot(up);
                    if (vDotNormal < 0) {
                        playerState.velocity.sub(up.multiplyScalar(vDotNormal));
                        // Ground Crash
                        if (vDotNormal < -15 && Date.now() > playerState.invulnerableUntil) {
                             playerState.health--;
                             playerState.invulnerableUntil = Date.now() + 2000;
                             if(crashSound.isPlaying) crashSound.stop(); crashSound.play();
                             if(playerState.health <= 0) triggerGameOver();
                        }
                    }
                }
                const currentUp = new THREE.Vector3(0, 1, 0).applyQuaternion(dolly.quaternion);
                const alignmentQ = new THREE.Quaternion().setFromUnitVectors(currentUp, up);
                dolly.quaternion.premultiply(alignmentQ);
            } else {
                // ... Flat Physics
                playerState.velocity.x -= playerState.velocity.x * damp * dt;
                playerState.velocity.z -= playerState.velocity.z * damp * dt;
                playerState.velocity.y -= playerState.velocity.y * damp * dt;
                
                if (playerState.velocity.length() > 1.0) {
                    const direction = playerState.velocity.clone().normalize();
                    raycaster.set(dolly.position, direction);
                    const hits = raycaster.intersectObjects(cityGroup.children);
                    
                    if (hits.length > 0 && hits[0].distance < 3.0) {
                        // Building Crash
                        if (Date.now() > playerState.invulnerableUntil) {
                             playerState.health--;
                             playerState.invulnerableUntil = Date.now() + 2000;
                             if(crashSound.isPlaying) crashSound.stop(); crashSound.play();
                             if(playerState.health <= 0) triggerGameOver();
                        }
                        playerState.velocity.negate().multiplyScalar(0.5);
                    }
                }
                
                // Ground check flat
                 if(dolly.position.y < 0) { 
                     // Hard landing
                     if (playerState.velocity.y < -15 && Date.now() > playerState.invulnerableUntil) {
                          playerState.health--;
                          playerState.invulnerableUntil = Date.now() + 2000;
                          if(crashSound.isPlaying) crashSound.stop(); crashSound.play();
                          if(playerState.health <= 0) triggerGameOver();
                     }
                     dolly.position.y = 0; 
                     playerState.velocity.y = Math.max(0, playerState.velocity.y); 
                }
            }
            if (playerState.velocity.length() > clampLength) playerState.velocity.setLength(clampLength);

            handleVRInput(dt); handleDesktopInput(dt);
            dolly.position.addScaledVector(playerState.velocity, dt);
            updateHUD();
        }
        
        // --- Search Functions ---
        window.loadAustin = function() {
            const lat = 30.2672; const lon = -97.7431; const offset = 0.005;
            document.getElementById('loading').innerText = "Loading Austin, TX...";
            window.fetchRealCityData(lat - offset, lon - offset, lat + offset, lon + offset, lon, lat);
        };
        window.searchCity = async function() {
            const query = document.getElementById('city-input').value; if(!query) return;
            const loader = document.getElementById('loading'); loader.style.display = 'block'; loader.innerText = `Searching...`;
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const geoData = await geoRes.json();
                if(!geoData || geoData.length === 0) { loader.innerText = "City not found."; return; }
                const lat = parseFloat(geoData[0].lat); const lon = parseFloat(geoData[0].lon);
                loader.innerText = `Found: ${geoData[0].display_name}. Loading 3D Data...`;
                const offset = 0.005;
                await window.fetchRealCityData(lat - offset, lon - offset, lat + offset, lon + offset, lon, lat);
            } catch (e) { console.error(e); loader.innerText = "Error connecting to map services."; }
        };
        window.fetchRealCityData = async function(s, w, n, e, centerLon, centerLat) {
            if(!s) { s=40.710; w=-74.010; n=40.715; e=-74.005; centerLon=w; centerLat=s; }
            const loader = document.getElementById('loading'); loader.style.display = 'block';
            window.switchLocation('metro'); 
            while(cityGroup.children.length > 1){ cityGroup.remove(cityGroup.children[1]); }
            const query = `[out:json];(way["building"](${s},${w},${n},${e}););out body;>;out skel qt;`;
            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:query});
                const data = await response.json();
                processOSMData(data, centerLon, centerLat);
                loader.style.display = 'none';
            } catch (e) { console.error(e); loader.innerText = "Error fetching geometry."; }
        };

        init();
        animate();

    </script>
</body>
